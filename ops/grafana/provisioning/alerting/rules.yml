apiVersion: 1

groups:
  - orgId: 1
    name: kind-1-error-alerts
    folder: Kind-1 Error Alerts
    interval: 1m
    rules:
      - uid: parkspot-unhandled-errors-total
        title: "parkspot-backend: unhandled errors"
        condition: C
        data:
          # A: the actual firing condition - collapses across the error and
          # route labels so this fires for ANY unexpected error, not just a
          # specific sentinel/route combination
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(parkspot_unhandled_errors_total[5m]))
              instant: true
          # B: the same window WITHOUT the sum, kept per-label, purely so its
          # result can be put in the notification body - this is what lets a
          # notification say which sentinel and which route actually broke
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: B
              expr: increase(parkspot_unhandled_errors_total[5m])
              instant: true
          # C: threshold check against A's single collapsed number
          - refId: C
            datasourceUid: "-100"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        # fire on the first occurrence - don't wait for a sustained breach
        for: 0s
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "parkspot-backend has at least one unhandled error in the last 5 minutes"
          breakdown: "{{ index .Values \"B\" }}"
        labels:
          severity: critical
