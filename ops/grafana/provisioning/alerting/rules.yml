apiVersion: 1

groups:
  - orgId: 1
    name: kind-1-error-alerts
    folder: Kind-1 Error Alerts
    interval: 1m
    rules:
      - uid: parkspot-unhandled-errors-total
        title: "parkspot-backend: unhandled errors"
        condition: C
        data:
          # B: per-label increase (error, route - no sum()). Evaluating the
          # condition on this directly, instead of a collapsed sum(), means
          # each distinct (route, error) combination becomes its own
          # independently-tracked alert instance in Alertmanager - so a
          # brand-new kind of error still notifies promptly no matter what
          # else recently fired. Collapsing with sum() (the original design)
          # made every firing carry the exact same alert identity
          # ({alertname, grafana_folder, severity} only), so Alertmanager's
          # own notification dedup (repeat_interval, 4h by default, never
          # overridden here) would silently swallow a second, unrelated
          # error's notification if it fired within 4h of the first one -
          # discovered by two different test triggers producing a Slack
          # message for the first but not the second
          #
          # The `or (... unless (... offset 5m))` half exists because a
          # counter's very first-ever sample for a given label combination
          # is invisible to increase(): there's no earlier sample to diff
          # against, so a brand-new (route, error) pair whose first
          # observed value is already nonzero (e.g. right after every
          # fresh deploy resets the counter) would otherwise never fire.
          # `metric unless (metric offset 5m)` returns the current value of
          # any series that didn't exist 5 minutes ago - i.e. exactly the
          # series increase() misses - so this catches that case too, with
          # no application code involved. Verified empirically: a counter
          # whose first-ever sample was already 1 showed increase() == 0
          # but this combined expression == 1.
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: B
              expr: (increase(parkspot_unhandled_errors_total[5m]) > 0) or (parkspot_unhandled_errors_total unless (parkspot_unhandled_errors_total offset 5m))
              instant: true
          # C: threshold check against B's per-label series, not a collapsed
          # scalar - this is what makes each label combination its own alert
          - refId: C
            datasourceUid: "-100"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        # fire on the first occurrence - don't wait for a sustained breach
        for: 0s
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "parkspot-backend has at least one unhandled error in the last 5 minutes"
        labels:
          severity: critical

  - orgId: 1
    name: availability-alerts
    folder: Availability Alerts
    interval: 1m
    rules:
      - uid: parkspot-backend-up
        title: "parkspot-backend: scrape target down"
        condition: C
        data:
          # B: Prometheus writes an `up` sample for this target on every scrape
          # - 1 if the scrape succeeded, 0 if it didn't (connection refused,
          # timeout, DNS failure, etc). Unlike kind-1's counter, this doesn't
          # depend on the app emitting anything, so it still fires when the
          # app can't run any of its own code at all: an unrecovered panic,
          # an OOM kill, or a container that never came back up after deploy
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: B
              expr: up{job="parkspot-backend"}
              instant: true
          - refId: C
            datasourceUid: "-100"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        # fire on the first missed scrape - don't wait for a sustained breach
        for: 0s
        # unlike kind-1's counter, `up` always has a sample once Prometheus is
        # scraping this target at all, whether the scrape succeeds or not - so
        # "no data" here means something broke in Grafana's query path to
        # Prometheus itself, not "nothing to report." Treat that as a problem
        # too rather than going quiet
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "Prometheus has not successfully scraped parkspot-backend - the process may be down, crashed, or unreachable"
        labels:
          severity: critical
