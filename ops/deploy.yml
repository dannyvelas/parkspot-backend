service: parkspot-backend
image: dannyvelas/parkspot-backend

# when deploying, `drain_timeout` decides "once the new container is spun up,
# and new requests are going to the new container, how many seconds should
# kamal-proxy wait before killing requests that went to the old container
# before the cutoff?" by hard-coding this to be the exact same value as what
# we're sending to *http.Server.Shutdown (30 seconds), we make sure kamal doesn't
# kill any connections that net/http wouldn't have killed anyway
drain_timeout: 30

servers:
  web:
    hosts:
      - 45.77.73.20
    options:
      # by default, the app container's name includes the deploy version. so by default, it changes every deploy.
      # here we set a fixed container network name so that prometheus can use it as a hostname when scraping
      network-alias: parkspot-backend-web

proxy:
  ssl: true
  host: api.park-spot.co
  app_port: 5000
  healthcheck:
    path: /up
    interval: 1
    timeout: 5

builder:
  arch: amd64

registry:
  server: ghcr.io
  username: dannyvelas
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy
  port: 27983
  keys:
    - ~/.ssh/id_ed25519_parkspot-kamal
  keys_only: true

env:
  clear:
    PORT: 5000
  secret:
    - DATABASE_URL
    - COOKIEDOMAIN
    - CORSALLOWEDORIGINS
    - FRONTENDURL
    - TOKEN_ACCESSSECRET
    - TOKEN_REFRESHSECRET
    - OAUTH_CLIENTID
    - OAUTH_CLIENTSECRET
    - OAUTH_REDIRECTURL
    - OAUTH_SCOPE
    - OAUTH_AUTHURL
    - OAUTH_TOKENURL
    - OAUTH_ACCESSTOKEN
    - OAUTH_REFRESHTOKEN
    - OAUTH_TOKENTYPE
    - OAUTH_EXPIRY

accessories:
  postgres:
    image: postgres:17.6
    host: 45.77.73.20
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: parkspot
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  backup:
    image: ghcr.io/dannyvelas/parkspot-backup:latest
    host: 45.77.73.20
    env:
      secret:
        - POSTGRES_APP_PASSWORD
        - VULTR_OBJECT_STORAGE_ACCESS_KEY
        - VULTR_OBJECT_STORAGE_SECRET_KEY
  prometheus:
    image: prom/prometheus
    host: 45.77.73.20
    # no `port:` - never published, reachable only by other containers on
    # the kamal network (i.e. the grafana accessory)
    files:
      - ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    # a named volume, not `directories:` (a host bind-mount) - prom/prometheus
    # runs as a non-root user (uid 65534) and the image pre-chowns /prometheus,
    # so a fresh named volume inherits the right ownership automatically. a
    # bind-mounted host folder would just be owned by whoever created it and
    # the container couldn't write to it
    volumes:
      - parkspot-backend-prometheus-data:/prometheus
  grafana:
    image: grafana/grafana
    host: 45.77.73.20
    # loopback-only. to reach this you need to port-forward via SSH
    port: "127.0.0.1:3000:3000"
    env:
      secret:
        - GF_SECURITY_ADMIN_PASSWORD
        - SLACK_WEBHOOK_URL
    # `files:` uploads via SCP without :recursive, so it can only take
    # individual files, not whole directories - list each provisioning
    # file explicitly, matching its path under /etc/grafana/provisioning
    files:
      - ops/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml
      - ops/grafana/provisioning/alerting/rules.yml:/etc/grafana/provisioning/alerting/rules.yml
      - ops/grafana/provisioning/alerting/contact-points.yml:/etc/grafana/provisioning/alerting/contact-points.yml
      - ops/grafana/provisioning/alerting/policies.yml:/etc/grafana/provisioning/alerting/policies.yml
      - ops/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ops/grafana/provisioning/dashboards/api-health.json:/etc/grafana/provisioning/dashboards/api-health.json
    # a named volume, not `directories:` (a host bind-mount) - grafana runs
    # as a non-root user (uid 472) and the image pre-chowns /var/lib/grafana,
    # so a fresh named volume inherits the right ownership automatically. a
    # bind-mounted host folder would just be owned by whoever created it and
    # the container couldn't write to it
    volumes:
      - parkspot-backend-grafana-data:/var/lib/grafana
