service: parkspot-backend
image: dannyvelas/parkspot-backend

# when deploying, `drain_timeout` decides "once the new container is spun up,
# and new requests are going to the new container, how many seconds should
# kamal-proxy wait before killing requests that went to the old container
# before the cutoff?" by hard-coding this to be the exact same value as what
# we're sending to *http.Server.Shutdown (30 seconds), we make sure kamal doesn't
# kill any connections that net/http wouldn't have killed anyway
drain_timeout: 30

servers:
  web:
    hosts:
      - 45.77.73.20

proxy:
  ssl: true
  host: api.park-spot.co
  app_port: 5000
  healthcheck:
    path: /up
    interval: 1
    timeout: 5

builder:
  arch: amd64

registry:
  server: ghcr.io
  username: dannyvelas
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy
  port: 27983
  keys:
    - ~/.ssh/id_ed25519_parkspot-kamal
  keys_only: true

env:
  clear:
    PORT: 5000
  secret:
    - DATABASE_URL
    - COOKIEDOMAIN
    - CORSALLOWEDORIGINS
    - FRONTENDURL
    - TOKEN_ACCESSSECRET
    - TOKEN_REFRESHSECRET
    - OAUTH_CLIENTID
    - OAUTH_CLIENTSECRET
    - OAUTH_REDIRECTURL
    - OAUTH_SCOPE
    - OAUTH_AUTHURL
    - OAUTH_TOKENURL
    - OAUTH_ACCESSTOKEN
    - OAUTH_REFRESHTOKEN
    - OAUTH_TOKENTYPE
    - OAUTH_EXPIRY

accessories:
  postgres:
    image: postgres:17.6
    host: 45.77.73.20
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: parkspot
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
