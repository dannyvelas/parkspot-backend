name: deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal -v 2.10.1

      - name: Install bws (Bitwarden Secrets Manager CLI)
        run: |
          curl -sL -o bws.zip https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
          sudo unzip -o bws.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/bws
          rm bws.zip

      - name: Set up SSH key for Kamal
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_parkspot-kamal
          chmod 600 ~/.ssh/id_ed25519_parkspot-kamal
          ssh-keyscan -p 27983 45.77.73.20 >> ~/.ssh/known_hosts

      - name: kamal deploy
        id: deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: kamal deploy -c ops/deploy.yml

      - name: Record deployment summary
        # if always() makes it so that this also runs on failed deploys
        if: always()
        run: |
          {
            echo "## Deployment"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.event.pull_request.merge_commit_sha }}\` |"
            echo "| PR | #${{ github.event.pull_request.number }} |"
            echo "| Image tag | \`ghcr.io/dannyvelas/parkspot-backend:${{ github.event.pull_request.merge_commit_sha }}\` |"
            echo "| Status | ${{ steps.deploy.outcome == 'success' && '✅ succeeded' || '❌ failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on deploy failure
        if: failure()
        run: |
          payload=$(jq -n \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg sha "${{ github.event.pull_request.merge_commit_sha }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{text: (":rotating_light: Deploy failed for PR #" + $pr + " (" + $sha + ")\n" + $url)}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$payload" "${{ secrets.DEPLOY_WEBHOOK_URL }}"
