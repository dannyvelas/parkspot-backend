name: deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # on.pull_request.branches already restricts this to PRs whose base is
    # main; this guard is the piece that actually matters - excludes PRs
    # that were closed WITHOUT merging (the trigger fires on both).
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal -v 2.10.1

      - name: Set up SSH key for Kamal
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_parkspot-kamal
          chmod 600 ~/.ssh/id_ed25519_parkspot-kamal
          ssh-keyscan -p 27983 45.77.73.20 >> ~/.ssh/known_hosts

      - name: kamal deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: kamal deploy
