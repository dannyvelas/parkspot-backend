service: parkspot-backend
image: dannyvelas/parkspot-backend

servers:
  web:
    hosts:
      - 45.77.119.253

proxy:
  ssl: true
  host: api.park-spot.co
  app_port: 5000

builder:
  arch: amd64

registry:
  server: ghcr.io
  username: dannyvelas
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy
  port: 27983
  keys:
    - ~/.ssh/id_ed25519_parkspot_kamal
  keys_only: true

env:
  clear:
    PORT: 5000
  secret:
    - DATABASE_URL
    - COOKIEDOMAIN
    - CORSALLOWEDORIGINS
    - FRONTENDURL
    - TOKEN_ACCESSSECRET
    - TOKEN_REFRESHSECRET
    - OAUTH_CLIENTID
    - OAUTH_CLIENTSECRET
    - OAUTH_REDIRECTURL
    - OAUTH_SCOPE
    - OAUTH_AUTHURL
    - OAUTH_TOKENURL
    - OAUTH_ACCESSTOKEN
    - OAUTH_REFRESHTOKEN
    - OAUTH_TOKENTYPE
    - OAUTH_EXPIRY

accessories:
  postgres:
    image: postgres:17.6
    host: 45.77.119.253
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: postgres
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
